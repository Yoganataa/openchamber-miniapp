<!doctype html>
<html lang="en" class="h-full">
  <head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#171515" />
    <title>OpenChamber Mobile</title>

    <style>
      html, body, #root { width: 100%; min-width: 320px; min-height: 100%; margin: 0; }
      body { min-height: 100vh; min-height: 100dvh; }
      .miniapp-startup {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        padding: max(28px, env(safe-area-inset-top)) 28px max(28px, env(safe-area-inset-bottom));
        overflow: hidden;
        background: var(--background, #171515);
        color: var(--foreground, #fffdf4);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }
      .miniapp-startup__content { width: min(100%, 360px); display: flex; flex-direction: column; align-items: center; }
      .miniapp-startup__brand { display: flex; align-items: center; gap: 11px; margin-bottom: clamp(64px, 15vh, 112px); }
      .miniapp-startup__mark {
        width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px;
        color: #d8f0a3; background: linear-gradient(145deg, #34452a, #1b251b);
        box-shadow: inset 0 1px 0 #ffffff24, 0 8px 26px #00000024;
      }
      .miniapp-startup__brand-name { font-size: 18px; font-weight: 650; letter-spacing: -.045em; }
      .miniapp-startup__brand-tag { display: block; margin-top: 2px; color: var(--startup-muted, #99958d); font-size: 9px; font-weight: 700; letter-spacing: .19em; text-align: left; }
      .miniapp-startup__spinner {
        position: relative; width: 48px; height: 48px; margin-bottom: 27px; border-radius: 50%;
        border: 2px solid color-mix(in srgb, currentColor 12%, transparent);
        border-top-color: var(--startup-accent, #a7c957); border-right-color: color-mix(in srgb, var(--startup-accent, #a7c957) 40%, transparent);
        animation: miniapp-spin .9s linear infinite;
      }
      .miniapp-startup__spinner::after {
        content: ""; position: absolute; inset: 7px; border: 1px solid color-mix(in srgb, currentColor 10%, transparent); border-radius: 50%;
      }
      .miniapp-startup h1 { margin: 0; font-size: 17px; font-weight: 620; letter-spacing: -.025em; }
      .miniapp-startup p { margin: 9px 0 0; max-width: 290px; color: var(--startup-muted, #99958d); font-size: 13px; line-height: 1.6; }
      .miniapp-startup__progress { width: 116px; height: 3px; margin-top: 29px; overflow: hidden; border-radius: 99px; background: color-mix(in srgb, currentColor 10%, transparent); }
      .miniapp-startup__progress span { display: block; width: 42%; height: 100%; border-radius: inherit; background: var(--startup-accent, #a7c957); animation: miniapp-progress 1.65s ease-in-out infinite; }
      .miniapp-startup__footer { margin-top: clamp(70px, 16vh, 124px); color: var(--startup-muted, #99958d); font-size: 9px; font-weight: 650; letter-spacing: .17em; }
      @keyframes miniapp-spin { to { transform: rotate(360deg); } }
      @keyframes miniapp-progress { 0% { transform: translateX(-130%); } 100% { transform: translateX(280%); } }
      @media (prefers-reduced-motion: reduce) {
        .miniapp-startup__spinner, .miniapp-startup__progress span { animation: none; }
      }
    </style>

    <script>
      // Resolve the theme and paint the correct background before first paint.
      (function () {
        try {
          var themeMode = localStorage.getItem('themeMode');
          var useSystem = localStorage.getItem('useSystemTheme');
          var variant = localStorage.getItem('selectedThemeVariant');
          var isDark;

          if (themeMode === 'dark') {
            isDark = true;
          } else if (themeMode === 'light') {
            isDark = false;
          } else if (themeMode === 'system' || useSystem === null || useSystem === 'true') {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else if (variant === 'light' || variant === 'dark') {
            isDark = variant === 'dark';
          } else {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }

          var root = document.documentElement;
          root.classList.add(isDark ? 'dark' : 'light');
          root.style.setProperty('color-scheme', isDark ? 'dark' : 'light');

          var bgDark = localStorage.getItem('splashBgDark') || '#171515';
          var bgLight = localStorage.getItem('splashBgLight') || '#fffdf4';
          var bg = isDark ? bgDark : bgLight;
          root.style.setProperty('--background', bg);
          root.style.setProperty('--foreground', isDark ? '#fffdf4' : '#171515');
          root.style.setProperty('--startup-muted', isDark ? '#99958d' : '#716b61');
          root.style.setProperty('--startup-accent', isDark ? '#a7c957' : '#5d7831');
          root.style.backgroundColor = bg;
        } catch (error) {
          /* unavailable localStorage defers to the default splash theme */
        }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body class="h-full bg-background text-foreground">
    <div id="root" class="h-full" aria-busy="true">
      <main class="miniapp-startup" role="status" aria-live="polite" aria-busy="true">
        <div class="miniapp-startup__content">
          <div class="miniapp-startup__brand" aria-label="OpenChamber Mini App">
            <span class="miniapp-startup__mark" aria-hidden="true">
              <svg viewBox="0 0 32 32" width="27" height="27" fill="none">
                <path d="M16 3.5 27.5 10v12L16 28.5 4.5 22V10L16 3.5Z" stroke="currentColor" stroke-width="1.7" />
                <path d="m4.8 10.2 11.2 6.4 11.2-6.4M16 16.8v11.1" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                <path d="m11 7 11.2 6.5v5.1" stroke="#a7c957" stroke-width="2" stroke-linecap="round" />
              </svg>
            </span>
            <span>
              <span class="miniapp-startup__brand-name">OpenChamber</span>
              <span class="miniapp-startup__brand-tag">TELEGRAM MINI APP</span>
            </span>
          </div>
          <span class="miniapp-startup__spinner" aria-hidden="true"></span>
          <h1 data-startup-title>Verifying your Telegram account</h1>
          <p data-startup-description>Checking your Telegram session and permissions.</p>
          <span class="miniapp-startup__progress" aria-hidden="true"><span></span></span>
          <span class="miniapp-startup__footer">SELF-HOSTED · ACCOUNT-ISOLATED</span>
        </div>
      </main>
    </div>
  </body>
</html>
