name: Deploy Telegram Serverless

on:
  push:
    branches:
      - main
    paths:
      - "tgcloud/**"
      - "tgcloud.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-tgcloud.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgcloud-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy backend modules
    if: github.ref == 'refs/heads/main'
    environment: main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Telegram host integration
        run: npm run typecheck

      - name: Build Mini App for same-origin hosting
        run: npm run build:miniapp:same-origin

      - name: Deploy changed Telegram Serverless modules
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${TGCLOUD_TOKEN:-}" ]; then
            echo "::error::Missing repository Actions secret TGCLOUD_TOKEN."
            exit 1
          fi

          npx tgcloud fetch
          npx tgcloud push tgcloud/
