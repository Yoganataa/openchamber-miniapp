name: Deploy Telegram Mini App

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".gitmodules"
      - "scripts/**"
      - "vendor/openchamber"
      - "tgcloud/**"
      - "tgcloud.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-tgcloud.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgcloud-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Telegram Mini App
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Telegram host integration
        run: npm run typecheck

      - name: Build Mini App for TGCloud root hosting
        run: npm run build

      - name: Deploy Mini App static files and scoped backend modules
        env:
          TGCLOUD_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${TGCLOUD_TOKEN:-}" ]; then
            echo "::error::Missing Environment secret ACCESS_TOKEN in GitHub Environment production."
            exit 1
          fi

          npx tgcloud fetch
          npx tgcloud push dist/
          npx tgcloud push tgcloud/
